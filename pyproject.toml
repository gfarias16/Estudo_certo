[project]
name = "projeto-questoes"
version = "0.2.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["config*", "study*", "content*"]
exclude = ["study.tests*"]
namespaces = false

[tool.setuptools.package-data]
content = ["*.csv"]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python scripts/build_frontend.py"

[tool.ruff]
line-length = 100
exclude = [".venv", ".local", "frontend", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
